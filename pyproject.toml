[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfp"
version = "0.1.1"
description = "Per-receiver invisible forensic watermarking with collusion-resistant codes"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python",
]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest"]

[project.scripts]
vfp = "vfp.cli:main"

[project.gui-scripts]
vfp-gui = "vfp.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
