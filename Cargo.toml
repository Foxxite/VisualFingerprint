[workspace]
resolver = "2"
members = ["crates/vfp-core", "crates/vfp-cli", "crates/vfp-server", "crates/vfp-app"]
# the app needs system web libraries on Linux, so plain `cargo test` skips it
default-members = ["crates/vfp-core", "crates/vfp-cli", "crates/vfp-server"]

[workspace.package]
version = "0.2.0"
edition = "2021"

# Registration is heavy; keep tests fast.
[profile.test]
opt-level = 3

# Crypto (Argon2, ChaCha) is far too slow unoptimised. Optimise dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
