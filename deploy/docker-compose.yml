# Start:   docker compose -f deploy/docker-compose.yml up -d
# Token:   docker compose -f deploy/docker-compose.yml logs vfp   (first start prints the admin token once)
# More:    docker compose -f deploy/docker-compose.yml exec vfp vfp-server token new --role trace --label phone
# Put an HTTPS reverse proxy (Caddy, nginx, Traefik) in front for use over the internet.
services:
  vfp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - vfp-data:/data   # master.key, vfp.db, originals, tokens. BACK THIS UP.
    environment:
      VFP_MAX_UPLOAD_MB: "4096"
      VFP_JOBS: "2"
      # Protected mode only: the key header is accepted only over HTTPS. Behind an HTTPS proxy
      # that sets X-Forwarded-Proto, uncomment this. Never expose the port without the proxy.
      # VFP_TRUST_PROXY: "true"
volumes:
  vfp-data:
