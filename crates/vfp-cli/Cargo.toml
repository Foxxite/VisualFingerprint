[package]
name = "vfp-cli"
version.workspace = true
edition.workspace = true
description = "vfp command line: init, receivers, asset, mark, trace"

[[bin]]
name = "vfp"
path = "src/main.rs"

[dependencies]
vfp-core = { path = "../vfp-core", features = ["remote"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
