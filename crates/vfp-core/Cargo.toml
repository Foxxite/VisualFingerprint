[package]
name = "vfp-core"
version.workspace = true
edition.workspace = true
description = "VisualFingerprint core: per-receiver invisible watermarking and leak tracing"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
statrs = "0.18"
nalgebra = "0.33"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
